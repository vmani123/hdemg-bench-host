# Hotspot probe — a short targeted test, NOT a stage of the plan and not comparable with
# the staged sweeps. Run it with hotspot_probe.sh, which keeps its results in a ledger of
# its own (results/hotspot-probe.jsonl).
#
# Two questions, on both chips at 2.4 GHz:
#   1. Is the TCP ceiling the default send buffer?  TCP with the stock build (baseline)
#      against TCP with ONLY the send buffer enlarged 8x (rung p1-tcp-sndbuf).
#   2. What does UDP look like once this Mac no longer drops datagrams itself?  UDP on
#      the stock build, at a handful of loads.
#
# THE RIG IS ENFORCED. `ssid` names the one network this may run on: the boards'
# firmware must be configured for it and this Mac must be associated to it, or nothing
# is built, flashed or measured.
#
# The Mac is on the hotspot's own Wi-Fi here (ap: iphone-hotspot-wifi), so the boards
# and the Mac share one channel and every frame crosses the same air twice. Expect
# roughly half of what a rig with a wired second hop would show. `allow_shared_band`
# accepts that knowingly; every run carries the warning.
#
# Sized to finish inside 30 minutes, which hotspot_probe.sh also enforces as a hard
# limit: 5 loads x (2 TCP builds + 1 UDP) x 2 chips = 30 runs of 20 s (about 14 min)
# plus 4 build-and-flash cycles (about 6 min) — about 20 min as expected, 27.5 min if
# every step takes its worst case. ONE repeat and short holds are what that costs: each
# point is a single 17 s measurement (after the 3 s discard), so treat small differences
# as noise and read the large ones.
stage: 1
repeats: 1
ap: iphone-hotspot-wifi
ssid: VikPhone
allow_shared_band: true
expected_idf: v6.0-dev-2980-gab149384e1-dirty
frame_bytes: 270
sweep: {start_mbps: 4, stop_mbps: 44, steps: 5, hold_s: 20, discard_s: 3}   # 4 14 24 34 44
cells:
  - {chip: esp32c5, band: "2.4", source: synth, transport: [tcp], tune: [baseline, p1-tcp-sndbuf]}
  - {chip: esp32c5, band: "2.4", source: synth, transport: [udp], tune: [baseline]}
  - {chip: esp32s3, band: "2.4", source: synth, transport: [tcp], tune: [baseline, p1-tcp-sndbuf]}
  - {chip: esp32s3, band: "2.4", source: synth, transport: [udp], tune: [baseline]}
