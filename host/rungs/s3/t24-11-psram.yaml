# Written by `bench tune` (study rung — not part of the formal ladder).
id: t24-11-psram
applies_to: esp32s3
parent: t24-08-extra-iram
study: max-tput
lever: psram_bufs
rationale: "This S3 has 8 MB embedded octal PSRAM. Espressif's best S3 rank (TCP TX\
  \ ~93, UDP TX ~105 Mbit/s) puts Wi-Fi/lwIP buffers there and enables A-MSDU TX,\
  \ which needs PSRAM. PSRAM is slower than SRAM, so it can lose \u2014 measure. Octal\
  \ PSRAM takes GPIO33-37; the QSPI ingress (GPIO 7, 9-14) is clear."
config:
  CONFIG_SPIRAM: y
  CONFIG_SPIRAM_MODE_OCT: y
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y
  CONFIG_ESP_WIFI_AMSDU_TX_ENABLED: y
  CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: null
measured_gain_pct: -13.38
measured:
  decision: rejected
  reason: 'regressed: tcp -15.3%, udp -13.4%'
  offered_mbps: 60.0
  tcp_mbps: 26.763
  udp_mbps: 38.633
  gain_tcp_pct: -15.31
  gain_udp_pct: -13.38
