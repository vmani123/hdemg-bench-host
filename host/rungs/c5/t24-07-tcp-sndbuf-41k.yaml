  reason: 'unsafe: heap low-water 14776 B is below the 20000 B floor (would have been:
    regressed: tcp -11.8%)'
  offered_mbps: 60.0
  tcp_mbps: 29.461
  udp_mbps: 49.857
  gain_tcp_pct: -11.78
  gain_udp_pct: 3.9
