id: t24-07-tcp-sndbuf-41k
applies_to: esp32c5
parent: t24-01-tcp-window
study: max-tput
lever: lwip_window
rationale: Added 13 Oct. With a 64 KB send buffer the C5's heap low-water was 2.5
  KB and the board went offline when a stream stalled. 41,760 B is Espressif's own
  C5 value (a RAM trade-off); the window stays 65,535.
config:
  CONFIG_LWIP_TCP_SND_BUF_DEFAULT: 41760
measured_gain_pct: 3.9
