id: r2-iram
applies_to: esp32c5
parent: r1-cpu-opt
lever: iram_wifi
rationale: "IRAM placement. Expected to help the C5 disproportionately: on ESP32 parts
  the per-packet cost is dominated by cache misses on flash-resident code and task-switch
  overhead, not arithmetic, and the single core carries all of it.
  CONFIG_ESP_INTR_IN_IRAM and CONFIG_ESP_PHY_IRAM_OPT are deliberately absent: on C5/IDF
  v6 the first is locked on unless SPI_FLASH_AUTO_SUSPEND is set and the second only
  affects the C2, so neither is a lever here — the declared exception, not an oversight.
  Note ESP_WIFI_IRAM_OPT and ESP_WIFI_RX_IRAM_OPT already default to y, so the only
  change this rung makes to the built image is LWIP_IRAM_OPTIMIZATION."
config:
  CONFIG_ESP_WIFI_IRAM_OPT: y
  CONFIG_ESP_WIFI_RX_IRAM_OPT: y
  CONFIG_LWIP_IRAM_OPTIMIZATION: y
measured_gain_pct: null
