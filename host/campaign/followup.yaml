# The follow-up campaign's rig (docs/CAMPAIGN.md). The tests themselves, and the rules
# that pick each chip's "best" setup from earlier results, live in bench/campaign.py.
campaign: followup-2026-10
state_dir: results/campaign/followup        # state.json, summary.md, logs/, ts/, matrices/
ledger: results/campaign/followup.jsonl

ap: house-wifi                              # a router rig; recorded in every run
ssid: House WiFi                            # the boards' network (both bands, one name)
# The Mac's network while a band is being MEASURED: always the other band, so the two
# hops never share a channel. Both are band-locked networks on the same LAN, set up on
# the router with the House WiFi password.
mac_networks:
  "2.4": House wifi 5g
  "5": House wifi 2g
expected_idf: v6.0-dev-2980-gab149384e1-dirty
frame_bytes: 270

# Offered load is capped at these (Mbit/s). They are the radio's raw rate at 40 MHz
# (HT40 MCS7, short guard interval), not a measured rig ceiling: the router's 2.4 GHz
# radio runs at 40 MHz for the whole campaign.
ceilings: {"2.4": 150, "5": 150}

# Each chip's design going in (13 Oct winners, at 20 MHz): host/rungs/<chip>/c-*.yaml.
designs: {esp32s3: c-s3-base, esp32c5: c-c5-base}
# The 40 MHz and other variants the campaign compares against them.
variants:
  esp32s3: {ht40: c-s3-ht40, p1: c-s3-p1, p2: c-s3-p2, p3: c-s3-p3}
  esp32c5: {ht40: c-c5-ht40, mcs9: c-c5-mcs9, p0: c-c5-p0, p1: c-c5-p1, p2: c-c5-p2,
            p3: c-c5-p3}
# Where each board's stream lands on this Mac (two boards can stream at once).
recv_ports: {esp32s3: 3333, esp32c5: 3343}
# Stage 2 link clocks to try, fastest first; the first that passes the link check is used.
# QSPI runs at 25 MHz only (user's call, 18 Oct).
qspi_hz: [25000000]
sdio_hz: [25000000, 4000000]
# H7 link pin edge speed (0 low .. 3 very high). The jumper harness rings at the H7's
# fastest edges: 25 MHz QSPI passes clean only at 0 on the C5 set (0 or 1 on the S3).
link_slew: 0
